# Release CI — Linux AppImage (x64).
# Trigger: push a version tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# Output: chattt-<version>.AppImage attached to the tag's DRAFT release.
name: release-linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage (x64)
        run: npm run dist:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach AppImage to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release/*.AppImage
